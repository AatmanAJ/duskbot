<!doctype html>
<html><head><meta charset="utf-8"><meta name="stage" content="1600x900">
<link rel="stylesheet" href="kit.css">
<style>
  .title { position: absolute; left: 56px; top: 40px; }
  .side { position: absolute; left: 930px; top: 52px; width: 614px; }
  .speed { margin-top: 18px; display: inline-flex; }
  .wash { top: 246px; height: 628px; padding: 30px 30px 28px; }
  .top { display: flex; align-items: center; gap: 14px; }
  .wash .sub { font-size: 21px; margin-top: 6px; }
  .fig.box { margin-top: 20px; height: 380px; padding: 18px; position: relative; overflow: hidden; }
  .grid { display: grid; grid-template-columns: repeat(60, 9px); gap: 1.6px; }
  .grid i { width: 9px; height: 5.8px; border-radius: 1.5px; background: #ececea; }
  .grid i.seen { background: #ffc7dc; } .grid i.hit { background: var(--pink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--pink); }
  .meter { margin-top: 22px; display: flex; align-items: flex-end; justify-content: space-between; }
  .meter .lab { font: 500 17px/1.3 var(--mono); color: var(--ink-3); }
  .meter .px { font-size: 60px; line-height: 0.9; }
  .idx { display: flex; flex-direction: column; gap: 8px; }
  .idx .row { gap: 16px; min-height: 50px; font: 500 17px/1 var(--mono); color: var(--ink-3); }
  .idx .row.on { background: var(--t-lemon); color: var(--ink); box-shadow: none; }
  .idx .who { position: relative; width: 32px; height: 32px; flex: none; }
  .key { position: absolute; z-index: 6; }
</style></head>
<body><div class="stage" id="stage"></div>
<script src="clock.js"></script><script src="vendor/crowd.js"></script><script src="kit.js"></script>
<script>
const stage = K.$("#stage");
K.el("div", { class: "h2 title", html: 'who owns<br>this <span class="hl blue">thread?</span>' }, stage);
const side = K.el("div", { class: "side" }, stage);
K.el("div", { class: "sub", html: 'every runtime event asks it. median <span class="m code">botByThread</span> on the bench: 30 bots × 100 threads.' }, side);
K.el("span", { class: "live grey speed", html: "<i></i>time slowed a million times" }, side);
const NS_BEFORE = 3978, NS_AFTER = 78, NS_PER_SCREEN_MS = 1;
const TARGET = 1500;

function card(x, w, name, pill, pillClass, sub) {
  const c = K.el("div", { class: "wash", style: `left:${x}px;width:${w}px` }, stage);
  const head = K.el("div", { class: "top" }, c);
  K.el("div", { class: "h3", text: name }, head);
  K.el("span", { class: `live ${pillClass}`, html: `<i></i>${pill}` }, head);
  K.el("div", { class: "sub", text: sub }, c);
  const box = K.el("div", { class: "fig box" }, c);
  const meter = K.el("div", { class: "meter" }, c);
  const l = K.el("div", {}, meter);
  K.el("div", { class: "lab", text: "one lookup" }, l);
  const num = K.el("div", { class: "px", text: "0 ns" }, l);
  const right = K.el("div", { class: "lab", style: "text-align:right" }, meter);
  return { c, box, num, right };
}
const A = card(56, 734, "before", "a search", "grey", "check each bot's threads in order until the owner turns up.");
const B = card(810, 734, "after", "an index", "", "one map lookup, checked against the live list.");

const grid = K.el("div", { class: "grid" }, A.box);
const cells = Array.from({ length: 3000 }, () => K.el("i", {}, grid));
A.right.innerHTML = "threads checked<br>0 of 3,000";

const idx = K.el("div", { class: "idx" }, B.box);
const ROWS = [["media-nova-t17", "nova", "pip"], ["media-rivet-t03", "rivet", "wisp"], ["media-quill-t42", "quill", "kit"], ["media-echo-t88", "echo", "goo"], ["media-juno-t09", "juno", "bruin"]];
const idxRows = ROWS.map(([thread, owner, body], i) => {
  const r = K.el("div", { class: "row" }, idx);
  K.el("span", { text: thread, style: "flex:1" }, r);
  K.el("span", { text: "→", style: "color:var(--ink-3)" }, r);
  const who = K.el("span", { class: "who" }, r);
  const bot = K.bot(who, body, { size: 32, seed: i + 2 });
  K.el("span", { text: owner, style: "width:70px;margin-left:0;color:var(--ink)" }, r);
  return { r, bot };
});
B.right.innerHTML = "entries read<br>0";
const keyA = K.el("div", { class: "chip line key", html: '<span class="mono">media-quill-t42</span>', style: "left:480px;top:180px;opacity:0" }, stage);
const ptr = K.pointer(stage, { label: "event", colour: K.COL.blue });
const fade = K.el("div", { class: "fade", style: "opacity:0" }, stage);
const GO = 1.6;
let hopped = false;

window.SCENE = {
  duration: 9.6, still: 6.4,
  update(t) {
    K.reveal(A.c, t, 0.15, { dy: 34 }); K.reveal(B.c, t, 0.3, { dy: 34 });
    K.pop(keyA, t, 0.9, { from: 0.8 });
    ptr.move(K.lerp(600, 664, K.out(K.span(t, 0.9, 1.5))), K.lerp(150, 196, K.out(K.span(t, 0.9, 1.5))));
    ptr.el.style.opacity = K.clamp(K.span(t, 0.9, 1.1)) * (1 - K.span(t, 8.6, 9));
    const ms = Math.max(0, t - GO) * 1000;
    const nsA = Math.min(NS_BEFORE, ms * NS_PER_SCREEN_MS);
    const walked = Math.floor((nsA / NS_BEFORE) * TARGET);
    cells.forEach((c, i) => { c.className = i < walked ? "seen" : ""; });
    if (nsA >= NS_BEFORE) cells[TARGET].className = "hit";
    A.num.textContent = `${Math.round(nsA).toLocaleString("en-US")} ns`;
    A.right.innerHTML = `threads checked<br>${walked.toLocaleString("en-US")} of 3,000`;
    const nsB = Math.min(NS_AFTER, nsA);
    B.num.textContent = `${Math.round(nsB)} ns`;
    const done = nsB >= NS_AFTER;
    idxRows.forEach((r, i) => r.r.classList.toggle("on", done && i === 2));
    B.right.innerHTML = `entries read<br>${done ? 1 : 0}`;
    if (done && !hopped) { hopped = true; idxRows[2].bot.react("boing"); }
    fade.style.opacity = K.span(t, 9.1, 9.6);
  },
};
</script></body></html>
