<!doctype html>
<html><head><meta charset="utf-8"><meta name="stage" content="1600x900">
<link rel="stylesheet" href="kit.css">
<style>
  .bar { position: absolute; left: 56px; right: 56px; top: 30px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 550; font-size: 25px; letter-spacing: -0.02em; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .head { position: absolute; left: 0; right: 0; top: 112px; text-align: center; }
  .head .tag { margin-bottom: 26px; }
  .head .mega { font-size: 118px; }
  .head .sub { margin-top: 26px; }
  .poster { left: 56px; right: 56px; top: 520px; bottom: 26px; }
  .stat { position: absolute; z-index: 2; top: 24px; width: 360px; padding: 18px 24px 18px; background: #fff; border-radius: var(--r-l); box-shadow: var(--lift); }
  .stat .px { font-size: 66px; line-height: 0.9; }
  .stat p { margin-top: 10px; font-size: 21px; line-height: 1.25; letter-spacing: -0.015em; font-weight: 500; color: var(--ink-2); }
</style></head>
<body><div class="stage" id="stage"></div>
<script src="clock.js"></script><script src="vendor/crowd.js"></script><script src="kit.js"></script>
<script>
const stage = K.$("#stage");
const bar = K.el("div", { class: "bar" }, stage);
K.el("span", { class: "brand", html: `<img src="${K.ART}mark-320.webp" alt="">dusk bot` }, bar);
K.el("span", { class: "tag", html: "<i></i>pull request · draft" }, bar);
const head = K.el("div", { class: "head" }, stage);
const tag = K.el("div", { class: "tag", html: "<i></i>live stream · bot registry · thread saves" }, head);
const h1 = K.el("div", { class: "mega" }, head);
const l1 = K.el("div", {}, h1);
l1.append("every ");
const crew = ["pip", "mochi", "loaf"].map((n, i) => K.inlineBot(l1, n, { seed: 3 + i, em: 0.72 }));
l1.append(" change,");
const l2 = K.el("div", { html: 'sent as a <span class="hl">patch.</span>' }, h1);
const sub = K.el("div", { class: "sub", html: 'the live stream sends what changed: a <span class="m code">task.patch</span>, a <span class="m code">bot.patch</span>, or nothing at all.' }, head);

const poster = K.el("div", { class: "poster" }, stage);
K.el("img", { class: "bg", src: K.ART + "hero-bg.webp", style: "object-position:center 74%" }, poster);
const clouds = [K.cloud(poster, { kind: "pink", x: 120, y: 30, w: 190 }), K.cloud(poster, { kind: "lemon", x: 980, y: 70, w: 130 })];
const STATS = [["7.7×", "fewer bytes on the live stream"], ["21×", "faster bot and thread lookups"], ["22.7×", "faster thread saves"]];
const stats = STATS.map(([n, label], i) => {
  const s = K.el("div", { class: "stat", style: `left:${92 + i * 452}px` }, poster);
  K.el("div", { class: "px", text: n }, s);
  K.el("p", { text: label }, s);
  return s;
});
// the crew stands on the meadow, each sending a patch now and then
const W = 1488, GROUND = 330;
const NAMES = ["pip", "kit", "hop", "bruin", "mochi", "loaf", "cheep", "ribbit", "goo", "puff", "wisp", "hoot"];
const bots = NAMES.map((name, i) => ({ name, x: 70 + i * ((W - 140) / (NAMES.length - 1)), bot: K.bot(poster, name, { x: 70 + i * ((W - 140) / (NAMES.length - 1)), y: GROUND, size: 70, seed: 11 + i, stand: true }) }));
const r = K.rng(9);
const SENDS = [];
for (let i = 0; i < 24; i++) {
  const b = (i * 5 + 2) % bots.length;
  const kind = r() < 0.7 ? "task.patch" : "bot.patch";
  SENDS.push({ b, at: 1.9 + i * 0.34, kind, bytes: kind === "task.patch" ? 160 + Math.floor(r() * 80) : 220 + Math.floor(r() * 40) });
}
const chips = SENDS.map((s) => {
  const c = K.el("div", { class: "chip", html: `<span>${s.kind}</span><span class="mono">${s.bytes} B</span>`, style: "opacity:0;z-index:3" }, poster);
  return { ...s, c };
});
const fade = K.el("div", { class: "fade", style: "opacity:0" }, stage);
let reacted = new Set();

window.SCENE = {
  duration: 8.4, still: 5.3,
  update(t) {
    K.reveal(tag, t, 0.05); K.reveal(l1, t, 0.15, { dy: 40 }); K.reveal(l2, t, 0.3, { dy: 40 }); K.reveal(sub, t, 0.5);
    const clip = K.out(K.span(t, 0.7, 1.5));
    poster.style.clipPath = `inset(${(1 - clip) * 50}% ${(1 - clip) * 8}% 0 ${(1 - clip) * 8}% round 40px)`;
    stats.forEach((s, i) => K.reveal(s, t, 1.3 + i * 0.12, { dy: 36 }));
    clouds.forEach((c) => c(t));
    bots.forEach((b, i) => K.reveal(b.bot.svg, t, 1.1 + i * 0.05, { dy: 18 }));
    chips.forEach((s) => {
      const p = K.span(t, s.at, s.at + 1.3);
      const b = bots[s.b];
      const w = s.c.offsetWidth;
      const x = Math.max(8, Math.min(W - w - 8, b.x - w / 2));
      s.c.style.left = `${x}px`;
      s.c.style.top = `${GROUND - 116 - K.out(p) * 22}px`;
      s.c.style.opacity = p <= 0 || p >= 1 ? 0 : Math.min(1, p * 6, (1 - p) * 4);
      s.c.style.transform = `scale(${0.8 + 0.2 * K.spring(K.span(t, s.at, s.at + 0.45))})`;
      const key = `${s.b}@${s.at}`;
      if (t >= s.at && !reacted.has(key)) { reacted.add(key); b.bot.react("boing"); }
    });
    fade.style.opacity = K.span(t, 7.9, 8.4);
  },
};
</script></body></html>
